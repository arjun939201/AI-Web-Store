services:
  - type: web
    name: ai-store-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-store-db
          property: connectionString
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-3-mini
      - key: AI_PROVIDER
        value: grok
      - key: CORS_ORIGINS
        value: https://ai-store-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://ai-store-web.onrender.com

  - type: web
    name: ai-store-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-store-api.onrender.com

databases:
  - name: ai-store-db
    databaseName: ai_store
    user: ai_store
