services:
  - type: web
    name: ai-store-api
    runtime: python
    rootDir: .
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: ai-store-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: AI_PROVIDER
        value: groq
      - key: AI_TIMEOUT_SECONDS
        value: "45"
      - key: ENABLE_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://ai-store-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://ai-store-web.onrender.com

  - type: web
    name: ai-store-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-store-api-ogwt.onrender.com

databases:
  - name: ai-store-db
    databaseName: ai_store
    user: ai_store
